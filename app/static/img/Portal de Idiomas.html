<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal de Idiomas</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/main.js"></script>
</head>
<body>

    
<div class="navbar">
    <h1>Portal de Idiomas</h1>
</div>


    <div class="container">
        
<div style="max-width: 400px; margin: 5rem auto;">
    <div class="card">
        <h2>Login</h2>
        <p class="muted">Accede a tu cuenta</p>

        
        
        
        <div class="flash-alert alert ">
            E-mail o contraseña incorrectos
        </div>
        
        
        
        <form method="POST">
            <div class="form-group">
                <label>E-mail</label>
                <input placeholder="Ejemplo: email@unam.mx" type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>

                <div class="input-wrapper">
                    <input placeholder="Ingresa tu contraseña" type="password" name="password" id="password" required>
        
                    <button type="button" id="togglePassword" class="toggle-password">
                        <img id="eyeIcon" src="/static/img/view.png" alt="Show Password">
                    </button>
                </div>
            </div>

            <button type="submit">Iniciar sesión</button>
        </form>
    </div>
</div>

    </div>

</body>
</html>
